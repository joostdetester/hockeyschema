name: CI

# test -> the "test" environment (freely pushable, latest work); acceptance
# -> the "acceptance" environment (promoted from test via PR once proven);
# main -> the "production" environment (promoted from acceptance via PR once
# proven there). acceptance and main both require a PR - no direct pushes -
# see branch protection in repo Settings. See
# tests/hockeyschema/ai/repo-structure.md for the full branch/environment
# model.
#
# This repo is a monorepo: apps/hockeyschema (the app) + tests/hockeyschema
# (this Playwright/Cucumber project). All npm commands below run with
# working-directory: tests/hockeyschema (job-level default) unless a job
# overrides it (the deploy job builds apps/hockeyschema instead), since
# tests/hockeyschema is where this project's package.json lives. Action
# inputs (`path:`, `node-version-file:`) are always resolved relative to the
# repo root regardless of working-directory, so those are explicitly
# prefixed with tests/hockeyschema/ wherever they appear.
on:
  push:
    branches: [test, acceptance, main]
  pull_request:
    branches: [test, acceptance, main]

jobs:
  # Resolves which branch, GitHub Environment (for BASE_URL/API_BASE_URL
  # secrets) and Firebase project alias (apps/hockeyschema/.firebaserc) this
  # run targets - computed once here rather than repeating the same
  # branch-name ternary in every downstream job. PRs target a branch without
  # being on it yet, so base_ref is what picks it there; push events use
  # ref_name directly. Anything other than acceptance/main (e.g. the test
  # branch itself, or any other branch someone pushes) falls back to test.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.r.outputs.branch }}
      environment: ${{ steps.r.outputs.environment }}
      firebase_project: ${{ steps.r.outputs.firebase_project }}
    steps:
      - id: r
        run: |
          BRANCH="${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}"
          case "$BRANCH" in
            main) ENVIRONMENT=production; FIREBASE_PROJECT=productie ;;
            acceptance) ENVIRONMENT=acceptance; FIREBASE_PROJECT=acceptatie ;;
            *) ENVIRONMENT=test; FIREBASE_PROJECT=test ;;
          esac
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "firebase_project=$FIREBASE_PROJECT" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/hockeyschema
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: 'tests/hockeyschema/.nvmrc'

      # npm install, not npm ci: this project may not have a committed
      # package-lock.json (the install step at scaffold time is optional),
      # and npm ci hard-requires one.
      - run: npm install

      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/hockeyschema
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: 'tests/hockeyschema/.nvmrc'

      - run: npm install

      - run: npm run typecheck

  # Builds apps/hockeyschema for the target environment and deploys it to
  # that environment's Firebase Hosting project, so Playwright/Accessibility
  # below then test the change that actually triggered this run - not
  # whatever was deployed previously. Only runs on push (i.e. after a merge
  # lands on test/acceptance/main): a pull_request run has nothing new to
  # deploy yet, and still tests the currently-live site as a sanity check,
  # same as before this job existed.
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [lint, typecheck, resolve]
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: apps/hockeyschema
    environment: ${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: 'tests/hockeyschema/.nvmrc'

      - run: npm install

      # Each Firebase project alias has its own Vite mode/.env file (see
      # apps/hockeyschema/package.json and .env.development/.env.acceptatie/
      # .env.production) - build with the one matching this run's target.
      - name: Build
        run: |
          case "${{ needs.resolve.outputs.firebase_project }}" in
            test) npm run build:test ;;
            acceptatie) npm run build:acceptatie ;;
            productie) npm run build ;;
          esac

      # FIREBASE_TOKEN comes from `firebase login:ci` (deprecated by Google
      # in favor of a service account + GOOGLE_APPLICATION_CREDENTIALS, but
      # the simplest option that works non-interactively without setting up
      # GCP IAM service accounts by hand). Repo-level secret, not per-
      # environment - one CI-account token covers all three Firebase
      # projects since they're all under the same Firebase account.
      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project "${{ needs.resolve.outputs.firebase_project }}" --token "$FIREBASE_TOKEN" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # Playwright and Accessibility only start once lint+typecheck are green —
  # no point spending browser-install + test time on code that fails the
  # cheap static checks first. `needs:` already skips this job on failure,
  # no extra `if:` needed.
  #
  # These two jobs run in parallel by default. If this SUT has a shared,
  # stateful test account (e.g. a demo site where every run logs into and
  # mutates the same cart/order data), running Accessibility scenarios that
  # navigate through that same flow concurrently with Playwright's own
  # scenarios can race and corrupt each other's state - happened on
  # shopping-cart-demo once its accessibility scans started covering
  # login/cart/checkout, not just the stateless homepage. Fix there was
  # making accessibility `needs: [lint, typecheck, playwright]` with
  # `if: always() && needs.lint.result == 'success' && needs.typecheck.result == 'success'`
  # so the two jobs never overlap - apply the same pattern here if this
  # project's a11y scans start touching stateful pages.
  accessibility:
    name: Accessibility
    runs-on: ubuntu-latest
    needs: [lint, typecheck, resolve, deploy]
    # deploy is skipped (not failed) on a pull_request run - only block on
    # an actual deploy failure, not on it having been skipped.
    if: always() && needs.lint.result == 'success' && needs.typecheck.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    defaults:
      run:
        working-directory: tests/hockeyschema
    environment: ${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: 'tests/hockeyschema/.nvmrc'

      - run: npm install

      - run: npx playwright install --with-deps

      # BASE_URL / API_BASE_URL fall back to the demo defaults in
      # config/project.config.ts when unset. Set the real values per
      # environment (Settings > Environments > test / acceptance /
      # production > Environment secrets) — this job's `environment:` above
      # picks which set applies. Runs only the @accessibility-tagged
      # scenarios — see ai/accessibility-testing.md.
      - run: npm run test:a11y
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}

      # Raw Allure result files (not the generated HTML report yet) — the
      # test-summary job below merges this with the Playwright job's results
      # into one combined Allure report. `if: always()` so a failing run
      # still uploads whatever results it produced.
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-accessibility
          path: tests/hockeyschema/allure-results/
          if-no-files-found: warn

      # Standalone HTML accessibility report (independent of Allure) built
      # from the per-scan records pageobjects/_shared/accessibility.ts wrote
      # to a11y-report-data/ - see ai/accessibility-testing.md. `if: always()`
      # so a failing scan still gets a report showing what it found.
      - name: Build accessibility HTML report
        if: always()
        run: npm run a11y:report
        env:
          BASE_URL: ${{ secrets.BASE_URL }}

      - name: Upload accessibility HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-report
          path: tests/hockeyschema/a11y-report/
          if-no-files-found: warn

  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    needs: [lint, typecheck, resolve, deploy]
    if: always() && needs.lint.result == 'success' && needs.typecheck.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    defaults:
      run:
        working-directory: tests/hockeyschema
    environment: ${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: 'tests/hockeyschema/.nvmrc'

      - run: npm install

      - run: npx playwright install --with-deps

      # Runs everything except @accessibility (that's the dedicated
      # Accessibility job above) — see ai/testing-guidelines.md.
      - run: npm run test:e2e
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-playwright
          path: tests/hockeyschema/allure-results/
          if-no-files-found: warn

  # Combines both jobs' raw Allure results into one report and publishes it
  # to GitHub Pages — a single meta overview (pass/fail per suite/tag) with
  # drill-down into every individual test, native to Allure. Runs even if
  # accessibility/playwright failed (`if: always()`), so a failing run still
  # gets a report showing what happened.
  #
  # NOTE: the published report is publicly reachable at the repo's Pages
  # URL, even though this repo was private when this was first set up -
  # GitHub Pages has no "private" option outside GitHub Enterprise Cloud.
  # The repo is now public anyway (required for Pages to work at all on this
  # plan), so this is no longer a gap.
  # test, acceptance and main each publish their own Allure report under
  # their own subpath (/test/, /acceptance/, /main/) on the one shared Pages
  # site, so a run on one branch never wipes out another branch's latest
  # report.
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [accessibility, playwright, resolve]
    if: always()
    defaults:
      run:
        working-directory: tests/hockeyschema
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    # Separate environment per branch (github-pages-test / github-pages-
    # acceptance / github-pages-main) so each branch keeps its own
    # deployment history and a permanently visible URL badge in the Actions
    # UI - GitHub Environments only shows the badge for the most recently
    # active deployment, so sharing one environment between branches meant
    # whichever branch deployed last silently marked the others' badges
    # inactive (the site itself stayed correct either way, only the UI badge
    # was affected).
    environment:
      name: github-pages-${{ github.ref_name }}
      url: ${{ steps.deployment.outputs.page_url }}${{ steps.branch.outputs.dir }}/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: 'tests/hockeyschema/.nvmrc'

      - run: npm install

      - name: Download Playwright Allure results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: allure-results-playwright
          path: tests/hockeyschema/allure-results

      - name: Download Accessibility Allure results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: allure-results-accessibility
          path: tests/hockeyschema/allure-results

      - name: Download accessibility HTML report
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: a11y-report
          path: tests/hockeyschema/a11y-report-download

      # This branch's own report lives under site/<branch>/.
      - name: Determine branch output path
        id: branch
        run: echo "dir=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      # Fills Allure's "Trend" widget, which otherwise stays empty forever —
      # each run starts from a clean allure-results/ with no run history of
      # its own. The previously deployed report's history/ is the only
      # place that history survives between runs, so pull it back from this
      # branch's own subpath on the live Pages site before generating
      # (best-effort: continue on 404 for the very first deploy of this
      # branch, when there's nothing to fetch yet).
      - name: Fetch previous report history (for Allure trend)
        continue-on-error: true
        run: |
          mkdir -p allure-results/history
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${REPO_NAME}/${{ steps.branch.outputs.dir }}/"
          for f in history.json history-trend.json categories-trend.json duration-trend.json retry-trend.json; do
            curl -fsSL "${PAGES_URL}history/$f" -o "allure-results/history/$f" 2>/dev/null || true
          done

      # Fills the "Environment" widget. Deliberately excludes BASE_URL /
      # API_BASE_URL / USER_EMAIL / USER_PASSWORD — this report is publicly
      # reachable (see the note on this job above), so nothing from the
      # environment secrets belongs here, even values that happen to be
      # harmless for today's demo SUT.
      - name: Write Allure environment info
        run: |
          {
            echo "Environment=${{ needs.resolve.outputs.environment }}"
            echo "Branch=${{ github.ref_name }}"
            echo "Node.js=$(node --version)"
          } > allure-results/environment.properties

      # Fills the "Executors" widget with a link back to the CI run.
      - name: Write Allure executor info
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${REPO_NAME}/"
          cat > allure-results/executor.json << EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildOrder": ${{ github.run_number }},
            "buildName": "CI #${{ github.run_number }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "${PAGES_URL}${{ steps.branch.outputs.dir }}/",
            "reportName": "Allure Report"
          }
          EOF

      - run: npx allure generate allure-results --clean -o site/${{ steps.branch.outputs.dir }}

      # Publishes the standalone accessibility HTML report (see
      # ai/accessibility-testing.md) alongside the Allure report, under this
      # branch's own subpath - must run after `allure generate` above, since
      # its --clean would otherwise wipe this out.
      - name: Include accessibility HTML report in the site
        continue-on-error: true
        run: |
          if [ -d a11y-report-download ] && [ -n "$(ls -A a11y-report-download 2>/dev/null)" ]; then
            mkdir -p "site/${{ steps.branch.outputs.dir }}/a11y-report"
            cp -r a11y-report-download/. "site/${{ steps.branch.outputs.dir }}/a11y-report/"
          fi

      # Recover every OTHER branch's last-deployed report so this deploy
      # doesn't wipe them out - actions/deploy-pages publishes the *entire*
      # uploaded artifact as the site each time, so anything not carried
      # forward here would be lost. Pulls the exact static files from each
      # other branch's last successful "Test Summary" run via the Actions
      # artifact it already uploaded to Pages, rather than trying to
      # reconstruct them (Allure's output includes many generated filenames
      # that aren't otherwise enumerable from outside the job).
      - name: Recover other branches' reports (avoid overwriting them)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for OTHER in test acceptance main; do
            [ "$OTHER" = "${{ steps.branch.outputs.dir }}" ] && continue
            for RUN_ID in $(gh run list -R "$GITHUB_REPOSITORY" --branch "$OTHER" --workflow ci.yml --limit 5 --json databaseId --jq '.[].databaseId'); do
              CONCLUSION=$(gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --json jobs --jq '.jobs[] | select(.name=="Test Summary") | .conclusion')
              if [ "$CONCLUSION" = "success" ]; then
                rm -rf "/tmp/other-artifact-$OTHER" "/tmp/other-extracted-$OTHER"
                mkdir -p "/tmp/other-artifact-$OTHER" "/tmp/other-extracted-$OTHER"
                gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n github-pages -D "/tmp/other-artifact-$OTHER"
                # That previous deploy's artifact is the whole site (its own
                # subpath plus whatever else was live then), not just its
                # own report - pull out only its "$OTHER/" subdirectory, or
                # a naive extract-in-place would nest it one level too deep
                # (site/$OTHER/$OTHER/... instead of site/$OTHER/...).
                tar -xf "/tmp/other-artifact-$OTHER/artifact.tar" -C "/tmp/other-extracted-$OTHER"
                if [ -d "/tmp/other-extracted-$OTHER/$OTHER" ]; then
                  rm -rf "site/$OTHER"
                  cp -r "/tmp/other-extracted-$OTHER/$OTHER" "site/$OTHER"
                fi
                break
              fi
            done
          done

      - name: Write Pages landing page
        run: |
          write_branch_link() {
            local branch="$1"
            [ -d "site/$branch" ] || return 0
            echo "<li><a href=\"$branch/\">$branch</a>"
            [ -d "site/$branch/a11y-report" ] && echo " (<a href=\"$branch/a11y-report/\">accessibility report</a>)"
            echo "</li>"
          }
          {
            echo "<!doctype html><meta charset=\"utf-8\"><title>Test Reports</title>"
            echo "<h1>Test Reports</h1><ul>"
            write_branch_link test
            write_branch_link acceptance
            write_branch_link main
            echo "</ul>"
          } > site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: tests/hockeyschema/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Link report in step summary
        run: |
          echo "## Test Report" >> "$GITHUB_STEP_SUMMARY"
          echo "- Allure report: ${{ steps.deployment.outputs.page_url }}${{ steps.branch.outputs.dir }}/" >> "$GITHUB_STEP_SUMMARY"
          if [ -d "site/${{ steps.branch.outputs.dir }}/a11y-report" ]; then
            echo "- Accessibility HTML report: ${{ steps.deployment.outputs.page_url }}${{ steps.branch.outputs.dir }}/a11y-report/" >> "$GITHUB_STEP_SUMMARY"
          fi
