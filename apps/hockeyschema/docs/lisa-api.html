dance() in functions/index.js daadwerkelijk uitleest (field, meeting_time, persons[].member_name/status). De volledige response bevat vermoedelijk meer velden.\n", "operationId": "getMatchTile", "x-source": "apps/hockeyschema/functions/index.js", "parameters": [{"$ref": "#/components/parameters/clubId"}, {"name": "matchId", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"field": {"type": "string", "description": "Veldnaam, incl. sponsorprefix (zie ook trainingschema.field)."}, "meeting_time": {"type": "string", "description": "Verzameltijd, bv. \"08:45:00\" (alleen HH:MM wordt gebruikt door dit project)."}, "persons": {"type": "array", "items": {"type": "object", "properties": {"member_name": {"type": "string"}, "status": {"type": "string", "description": "Aanwezigheidsstatus, bv. \"present\"/\"absent\"/\"unknown\"."}}}}}, "additionalProperties": true}}}}}}}, "/v1/duda/{clubDudaId}/teams/{teamId}/poules": {"get": {"tags": ["Club (publiek/duda)"], "summary": "Poule-stand van een team (publieke club-website widget)", "description": "Publieke, read-only club-website API (\"duda\"), los van de persoonlijke \"my\"-API hierboven — gebruikt een eigen `authorization`-header (`LISA_CLUB_AUTHORIZATION_HEADER`) i.p.v. `x-lisa-auth-token`. Nog niet bevestigd via een live HAR-capture in dit project; schema is afgeleid van de velden die refreshTeamStandings() in functions/index.js daadwerkelijk uitleest (`data.teams`).\n", "operationId": "getClubTeamPoules", "x-source": "apps/hockeyschema/functions/index.js", "security": [{"LISA_CLUB_AUTHORIZATION_HEADER": []}], "parameters": [{"name": "clubDudaId", "in": "path", "required": true, "schema": {"type": "string"}, "description": "Club-website-specifieke id (los van de \"my\"-API club-guid)."}, {"name": "teamId", "in": "path", "required": true, "schema": {"type": "string"}, "descrip
